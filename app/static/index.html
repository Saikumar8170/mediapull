<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F3EF" />
  <title>MEDIAPULL — YT / IG Pipeline</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">MEDIAPULL</span>
      </div>
      <div class="topbar-meta">
        <span class="tag">YT + IG</span>
        <span class="tag">MP4 / MP3</span>
      </div>
    </header>

    <section class="panel" aria-label="Media converter">
      <form id="convert-form" novalidate>
        <div class="field-head">
          <label for="url-input" class="field-label">SOURCE URL</label>
          <span id="platform-badge" class="platform-badge" data-platform="none">WAITING</span>
        </div>

        <div class="url-row">
          <input
            id="url-input"
            type="url"
            inputmode="url"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://youtube.com/watch?v=... or instagram.com/reel/..."
            required
          />
          <button type="button" id="paste-btn" class="btn-util" title="Paste from clipboard">PASTE</button>
          <button type="button" id="clear-btn" class="btn-util hidden" title="Clear URL">CLR</button>
        </div>

        <div id="preview-card" class="preview-card hidden" aria-live="polite">
          <img id="preview-thumb" class="preview-thumb" alt="" />
          <div class="preview-info">
            <div id="preview-title" class="preview-title"></div>
            <div id="preview-meta" class="preview-meta"></div>
          </div>
        </div>

        <div class="controls-grid">
          <div class="control-block">
            <span class="field-label">FORMAT</span>
            <div class="segmented" role="radiogroup" aria-label="Output format">
              <button type="button" class="seg-btn active" data-format="mp4" aria-pressed="true">MP4 VIDEO</button>
              <button type="button" class="seg-btn" data-format="mp3" aria-pressed="false">MP3 AUDIO</button>
            </div>
          </div>

          <div class="control-block">
            <span class="field-label" id="quality-label">RESOLUTION</span>
            <div id="quality-pills" class="pills" role="radiogroup" aria-label="Quality"></div>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">
          <span id="submit-text">CONVERT</span>
        </button>
      </form>

      <div id="pipeline-box" class="pipeline-box hidden" aria-live="polite">
        <div class="pipeline-steps">
          <div class="p-step" data-step="queued">01 QUEUE</div>
          <div class="p-step" data-step="downloading">02 FETCH</div>
          <div class="p-step" data-step="processing">03 MUX</div>
          <div class="p-step" data-step="ready">04 READY</div>
        </div>

        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div class="telemetry-row">
          <span id="telemetry-status" class="mono">INITIALIZING</span>
          <span id="telemetry-stats" class="mono">0.0%</span>
        </div>

        <div id="error-box" class="error-box hidden"></div>

        <div id="ready-box" class="ready-box hidden">
          <div class="ready-meta">
            <div id="ready-filename" class="ready-filename"></div>
            <div id="ready-size" class="mono ready-size"></div>
          </div>
          <a id="download-link" class="btn-download" href="#" download>SAVE FILE</a>
        </div>
      </div>
    </section>

    <section id="history-panel" class="history-panel hidden" aria-label="Recent conversions">
      <div class="history-head">
        <span class="field-label">RECENT</span>
        <button type="button" id="clear-history-btn" class="link-btn">CLEAR</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
